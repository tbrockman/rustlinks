[package]
name = "rustlinks"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-files = "0.6.5"
actix-web = { version = "4.5.1", features = ["rustls-0_22"] }
actix-web-opentelemetry = { version = "0.17.0", optional = true }
anyhow = "1.0.82"
clap = { version = "4.5.4", features = ["derive", "env"] }
dialoguer = "0.11.0"
dyn-fmt = "0.4.0"
etcd-rs = { path = "src/etcd-rs" }
futures = "0.3.30"
lazy_static = "1.4.0"
openidconnect = { version = "3.5.0", optional = true }
opentelemetry = { version = "0.22.0", optional = true }
opentelemetry-otlp = { version = "0.15.0", optional = true }
opentelemetry_sdk = { version = "0.22.1", features = [
    "rt-tokio-current-thread",
], optional = true }
regex = "1.10.4"
rustls = "0.22.4"
rustls-pemfile = "2.1.2"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
ssr_rs = { path = "src/ssr-rs", optional = true }
tera = { version = "1.19.1", optional = true }
thiserror = "1.0.58"
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = "0.1.15"
url = "2.5.0"
urlencoding = "2.1.3"

[features]
default = ["tracing", "metrics", "li", "glean", "tera"]
tracing = [
    "opentelemetry",
    "opentelemetry_sdk",
    "opentelemetry-otlp",
    "actix-web-opentelemetry",
]
metrics = [
    "opentelemetry",
    "opentelemetry_sdk",
    "actix-web-opentelemetry/metrics",
    "opentelemetry-otlp/metrics",
]
li = []
glean = []

ui = ["ssr_rs"]
oauth = ["ui", "openidconnect"]

[dev-dependencies]
cargo-watch = "8.5.2"

[profile.release]
lto = true
