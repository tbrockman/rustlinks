receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  clickhouse/traces:
    username: default
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    ttl: 72h
    traces_table_name: otel_traces
  clickhouse/metrics:
    username: default
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    ttl: 0
    metrics_table_name: otel_metrics

extensions:
  health_check:

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse/metrics]
